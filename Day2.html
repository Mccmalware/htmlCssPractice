<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <nav>
        <a href="Day1.html">Day1</a>
        <a href="Day2.html">Day2</a>
    </nav>
    <form action="">
        <H1>Contact Us</H1>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
        <label for="contact">Contact:</label>
        <input type="tel" id="contact" name="contact" required placeholder="Enter your contact number">
        <label for="message">Message:</label>
        <textarea id="message" name="message" required placeholder="Enter your message" ></textarea>
        <br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="checkbox" id="consent" name="consent" value="yes">
        <br>
        <label for="consent">I agree to the Privacy Policy</label>
        <br>
        <a href="https://www.example.com" target="_blank">Privacy Policy</a>
        <br>
        <input type="submit" value="Submit">
        
    </form>

</body>
</html>
